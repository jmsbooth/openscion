[package]
name = "openscion-core"
description = "Foundational local repository lifecycle for an independent agent-native source control system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Explicit debug-only fault checkpoint build; never shipped in default CLI.
qa-fault-injection = []

[dependencies]
# Audited upstream hash implementation; no custom cryptography.
sha2 = { version = "=0.10.9", default-features = false }

# Linux syscall constants and cross-libc syscall invocation.
libc = { version = "=0.2.191", default-features = false }
